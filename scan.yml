# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/scan.yml — GitHub Actions : surveillance automatique (Playwright Gratuit)
# ─────────────────────────────────────────────────────────────────────────────

name: UberEats Monitor — Scan toutes les 10 min

on:
  schedule:
    # Toutes les 10 min, entre 09h et 19h UTC = 11h–21h heure française (été, UTC+2)
    - cron: "*/10 9-19 * * *"

  # Déclenchement manuel (pour tester)
  workflow_dispatch:

# Permissions pour commiter la BDD + déployer GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    name: Scan des villes UberEats
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: 📥 Checkout du dépôt
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Dépendances & Playwright Chromium ─────────────────────────
      - name: 📦 Installer les dépendances & Playwright
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # ── 4. Répertoires ───────────────────────────────────────────────────────
      - name: 📁 Préparer les répertoires
        run: |
          mkdir -p data
          mkdir -p docs

      # ── 5. Scraper via Playwright (100% Gratuit) ──────────────────────────────
      - name: 🔍 Scanner les villes UberEats
        run: python scraper.py

      # ── 6. Générer le dashboard HTML ─────────────────────────────────────────
      - name: 📊 Générer le dashboard
        run: python dashboard.py

      # ── 7. Commiter BDD + dashboard ──────────────────────────────────────────
      - name: 💾 Commiter les nouvelles données
        run: |
          git config user.name "UberEats Monitor Bot"
          git config user.email "bot@ubereats-monitor.local"
          git add data/history.db docs/index.html
          git diff --staged --quiet || git commit -m "📊 Scan $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
