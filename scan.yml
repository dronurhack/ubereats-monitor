name: UberEats Monitor — Scan toutes les 10 min

on:
  schedule:
    - cron: "*/10 9-19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    name: Scan des villes UberEats
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: 📥 Checkout du dépôt
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Installer les dépendances
        run: pip install -r requirements.txt

      - name: 📁 Préparer les répertoires
        run: |
          mkdir -p data
          mkdir -p docs

      - name: 🔍 Scanner les villes UberEats
        env:
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
        run: python scraper.py

      - name: 📊 Générer le dashboard
        run: python dashboard.py

      - name: 💾 Commiter les nouvelles données
        run: |
          git config user.name "UberEats Monitor Bot"
          git config user.email "bot@ubereats-monitor.local"
          git add data/history.db docs/index.html
          git diff --staged --quiet || git commit -m "📊 Scan $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
