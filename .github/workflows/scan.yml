# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/scan.yml — GitHub Actions : surveillance via Playwright
# ─────────────────────────────────────────────────────────────────────────────

name: UberEats Monitor — Scan toutes les 10 min

on:
  # Déclenché uniquement par Cron-job.org via l'API GitHub (workflow_dispatch)
  # Cron-job.org est configuré sur */15 11-23 * * * (Europe/Paris)
  workflow_dispatch:

# Permissions pour commiter la BDD + déployer GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    name: Scan des villes UberEats
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: 📥 Checkout du dépôt
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Dépendances ───────────────────────────────────────────────────────
      - name: 📦 Installer les dépendances
        run: pip install -r requirements.txt

      # ── 4. Playwright Chromium ───────────────────────────────────────────────
      - name: 🌐 Installer Chromium Playwright
        run: playwright install --with-deps chromium

      # ── 5. Répertoires ───────────────────────────────────────────────────────
      - name: 📁 Préparer les répertoires
        run: |
          mkdir -p data
          mkdir -p docs

      # ── 6. Scraper via Playwright ───────────────────────────────────────────
      - name: 🔍 Scanner les villes UberEats
        run: python scraper.py

      # ── 7. Générer le dashboard HTML ─────────────────────────────────────────
      - name: 📊 Générer le dashboard
        run: python dashboard.py

      # ── 8. Commiter BDD + dashboard ──────────────────────────────────────────
      - name: 💾 Commiter les nouvelles données
        run: |
          git config user.name "UberEats Monitor Bot"
          git config user.email "bot@ubereats-monitor.local"
          git add data/history.db docs/index.html
          git diff --staged --quiet || git commit -m "📊 Scan $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
