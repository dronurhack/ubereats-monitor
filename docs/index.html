<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="60">
<title>UberEats Monitor — Chargement...</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0a0f1e;color:#f9fafb;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}
.card{background:#111827;border:1px solid #1f2937;border-radius:20px;padding:60px 40px;max-width:480px}
.icon{font-size:64px;margin-bottom:24px;animation:spin 2s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
h1{font-size:1.6rem;font-weight:800;background:linear-gradient(90deg,#a5b4fc,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
p{color:#9ca3af;font-size:0.9rem;line-height:1.6}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6366f1;margin:0 3px;animation:bounce 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🛵</div>
  <h1>UberEats Monitor</h1>
  <p>Le dashboard est en cours de génération...<br>
  Il sera disponible après le prochain scan automatique.<br><br>
  <span class="dot"></span><span class="dot"></span><span class="dot"></span><br><br>
  Lance un <strong style="color:#a5b4fc">Run workflow</strong> manuel dans l'onglet Actions pour accélérer !</p>
</div>
</body>
</html>
